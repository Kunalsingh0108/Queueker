services:
  # --- Backend: Node.js API + Socket.IO ---
  - type: web
    name: queueker-backend
    runtime: node
    rootDir: Queueker-Backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false   # Set manually in Render dashboard
      - key: JWT_SECRET
        sync: false   # Set manually in Render dashboard
      - key: ALLOWED_ORIGIN
        sync: false   # Set to your Render frontend URL after deploy

  # --- Frontend: React + Vite Static Site ---
  - type: web
    name: queueker-frontend
    runtime: static
    rootDir: Queueker-React
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # Set to your Render backend URL after deploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
